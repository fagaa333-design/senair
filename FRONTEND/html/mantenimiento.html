<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SENAIR | En mantenimiento</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; color: #17324d; background: #f4f7f8; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #eef5f7, #dcecf0); }
      main { width: min(100%, 620px); padding: clamp(36px, 8vw, 72px); text-align: center; background: #fff; border: 1px solid rgba(23, 50, 77, 0.12); box-shadow: 0 24px 60px rgba(23, 50, 77, 0.14); }
      .mark { display: inline-grid; width: 64px; height: 64px; margin-bottom: 24px; place-items: center; border-radius: 50%; color: #fff; background: #c41e3a; font: 700 28px/1 Arial, sans-serif; }
      h1 { margin: 0 0 16px; font-size: clamp(32px, 6vw, 52px); line-height: 1; }
      p { max-width: 430px; margin: 0 auto 28px; color: #536879; font: 17px/1.6 Arial, sans-serif; }
      a { color: #c41e3a; font: 700 15px Arial, sans-serif; text-decoration: none; }
      a:hover, a:focus-visible { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">S</span>
      <h1>En mantenimiento</h1>
      <p>Estamos realizando algunos ajustes en SENAIR. Regresa pronto para continuar.</p>
      <a href="../index.html">Volver al inicio</a>
    </main>
  </body>
</html>
